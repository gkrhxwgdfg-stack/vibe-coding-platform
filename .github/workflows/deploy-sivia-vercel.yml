# Déploiement automatique de Sivia sur Vercel (alternative à GitHub Pages)
# GitHub Pages est bloqué sur ce dépôt privé (nécessite GitHub Pro/Team).
# Ce workflow déploie sur Vercel via la CLI officielle, sans compte lié.
#
# Prérequis (une seule fois) :
#   1. Créer un token Vercel : https://vercel.com/account/tokens
#   2. Ajouter le secret VERCEL_TOKEN dans GitHub :
#      Settings > Secrets and variables > Actions > New repository secret
#      Nom : VERCEL_TOKEN   Valeur : <le token>
name: Déployer Sivia sur Vercel

on:
  push:
    branches: [main]
    paths:
      - 'sivia/**'
      - '.github/workflows/deploy-sivia-vercel.yml'
  pull_request:
    branches: [main]
    paths:
      - 'sivia/**'
      - '.github/workflows/deploy-sivia-vercel.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vercel-sivia
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sivia/package-lock.json

      - name: Installer les dépendances
        working-directory: sivia
        run: npm ci

      - name: Build de production
        working-directory: sivia
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}

      - name: Déployer sur Vercel (production)
        working-directory: sivia
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::warning::VERCEL_TOKEN non défini — déploiement Vercel ignoré."
            echo "Configurez-le dans Settings > Secrets and variables > Actions > Secrets."
            exit 0
          fi
          npm install --no-save vercel
          # Vercel détecte automatiquement Vite et le dossier dist/
          # vercel.json (à la racine du projet) gère le routage SPA.
          # --prod déploie en production, --yes accepte les valeurs par défaut.
          npx vercel deploy dist --prod --yes --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
