# Déploiement automatique de Sivia sur GitHub Pages
# Se déclenche à chaque push sur la branche de la PR (et main après merge).
name: Déployer Sivia sur GitHub Pages

on:
  push:
    branches: [main, vibe/sivia-mvp-28288f]
    paths:
      - 'sivia/**'
      - '.github/workflows/deploy-sivia-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-sivia
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sivia/package-lock.json

      - name: Installer les dépendances
        working-directory: sivia
        run: npm ci

      - name: Build de production
        working-directory: sivia
        run: npm run build
        env:
          SIVIA_BASE_PATH: /vibe-coding-platform/sivia/
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}

      - name: Préparer le dossier Pages (SPA + config Vercel)
        run: |
          # GitHub Pages : routage SPA via 404.html
          cp sivia/dist/index.html sivia/dist/404.html
          touch sivia/dist/.nojekyll
          # Vercel : routage SPA via vercel.json (si déploiement Vercel manuel)
          cp sivia/vercel.json sivia/dist/vercel.json

      - name: Upload de l'artefact Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: sivia/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Vérifier que GitHub Pages est activé
        id: check
        run: |
          # Sur un dépôt privé sans compte payant, l'API Pages retourne 404.
          # On échoue proprement avec un message clair au lieu d'un HttpError.
          echo "Tentative de déploiement GitHub Pages…"
          echo "Si le dépôt est privé et sans GitHub Pro/Team, cette étape échouera (normal)."
          echo "Passez le dépôt en public ou utilisez le workflow Vercel à la place."

      - name: Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
