name: Déployer Sivia sur GitHub Pages

on:
  push:
    branches:
      - main
      - vibe/sivia-mvp-28288f
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: sivia-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sivia/package-lock.json

      - name: Install dependencies
        working-directory: sivia
        run: npm ci

      - name: Build
        working-directory: sivia
        run: npm run build
        env:
          SIVIA_BASE_PATH: /vibe-coding-platform/sivia/
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}

      - name: Préparer le site statique
        run: |
          cp sivia/dist/index.html sivia/dist/404.html
          touch sivia/dist/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: sivia/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
