name: Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sivia/package-lock.json
      - name: Install
        working-directory: sivia
        run: npm ci
      - name: Vérifier la configuration Supabase
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "::error::Variables VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY manquantes."
            echo "Ajoutez-les dans Settings > Secrets and variables > Actions > Variables (dépôt)."
            exit 1
          fi
          echo "Configuration Supabase présente."
      - name: Build
        working-directory: sivia
        run: npm run build
        env:
          SIVIA_BASE_PATH: /vibe-coding-platform/
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      - name: Fallback SPA pour GitHub Pages
        run: cp sivia/dist/index.html sivia/dist/404.html
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: sivia/dist

      - name: Attendre la propagation de l'artefact
        run: sleep 15

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
