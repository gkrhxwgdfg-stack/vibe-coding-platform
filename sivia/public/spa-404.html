<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Savia — Recettes de famille</title>
    <script>
      // GitHub Pages ne sert pas de page 404.html custom sur les dépôts privés
      // (nécessite un compte payant). Ce fichier est un filet de sécurité :
      // si quelqu'un tombe sur une URL inconnue, on le renvoie à l'accueil.
      (function () {
        var base = '/vibe-coding-platform/sivia/';
        var path = window.location.pathname;
        // Si on est sur une sous-route de l'app, redirige vers l'accueil SPA
        if (path.indexOf(base) === 0 && path !== base && path !== base + 'index.html') {
          window.location.replace(base);
        }
      })();
    </script>
  </head>
  <body>
    <p>Redirection vers <a href="/vibe-coding-platform/sivia/">Savia — accueil</a>…</p>
  </body>
</html>
